                { statement: "是有的話應當遍是無常，因為是成實的話遍不是常法的緣故。", questions: ["宗要安立什麼？", "因要安立什麼？", "周遍要安立什麼？"], answers: ["是有的話遍是無常", "是成實的話遍不是常法", "是成實的話遍不是常法的話遍是有的話遍是無常"] }

        };

        let currentUnit = "A", currentQ = null, subQIndex = 0, userSessionRecords = [], streak = 0, attempts = 1, isPracticing = false;
        let lastQuestionIndex = -1;
        let recognition = null;
        let isListening = false;

        const startBtn = document.getElementById('startBtn'), stopBtn = document.getElementById('stopBtn'), unitSelect = document.getElementById('unitSelect');
        const rateSelect = document.getElementById('rateSelect');
        const userAnswerInput = document.getElementById('userAnswerInput');
        const micBtn = document.getElementById('micBtn');
        const speechHint = document.getElementById('speechHint');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('recording');
                speechHint.innerText = "🎙️ 正在聆聽中，請說出答案...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                // 清除常見標點符號
                const cleanText = transcript.replace(/[。，！？]/g, '').trim();
                userAnswerInput.value = cleanText;
                speechHint.innerText = `辨識結果："${cleanText}"`;
            };

            recognition.onerror = (event) => {
                isListening = false;
                micBtn.classList.remove('recording');
                if (event.error === 'no-speech') {
                    speechHint.innerText = "⚠️ 未檢測到聲音，請再試一次。";
                } else if (event.error === 'not-allowed') {
                    speechHint.innerText = "⚠️ 麥克風權限被阻擋，請開啟瀏覽器麥克風存取權。";
                } else {
                    speechHint.innerText = `⚠️ 語音辨識錯誤：${event.error}`;
                }
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('recording');
            };
        } else {
            speechHint.innerText = "您的瀏覽器不支援 Web Speech API 語音辨識，請使用 Chrome/Edge 瀏覽器。";
        }

        micBtn.onclick = () => {
            if (!recognition) {
                alert("您的瀏覽器暫不支援語音辨識功能，請手動輸入或使用 Chrome 瀏覽器。");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        };

        startBtn.onclick = () => {
            isPracticing = true; streak = 0; attempts = 1; currentUnit = unitSelect.value;
            startBtn.disabled = true; stopBtn.disabled = false; unitSelect.disabled = true;
            document.getElementById('streakDisplay').innerText = `連續通過: ${streak} / 10`;
            startNewQuestion();
        };

        function startNewQuestion() {
            document.getElementById('reviewPanel').style.display = 'none';
            document.getElementById('interactiveArea').style.display = 'none';
            document.getElementById('reviewContent').innerHTML = "";
            userAnswerInput.value = "";
            speechHint.innerText = "";
            
            const list = fullQuestionBank[currentUnit];
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * list.length);
            } while (list.length > 1 && newIndex === lastQuestionIndex);
            
            lastQuestionIndex = newIndex;
            currentQ = list[newIndex];
            subQIndex = 0; attempts = 1; userSessionRecords = [];
            
            document.getElementById('attemptDisplay').innerText = `本題嘗試: ${attempts}`;
            askQuestion(true);
        }

        function speakText(text, callback) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = parseFloat(rateSelect.value) || 1.25;
            utter.onend = callback;
            window.speechSynthesis.speak(utter);
        }

        function askQuestion(readStatement) {
            userAnswerInput.value = ""; 
            speechHint.innerText = "";
            document.getElementById('interactiveArea').style.display = 'none';
            
            let text = (readStatement ? currentQ.statement + "， " : "") + currentQ.questions[subQIndex];
            speakText(text, () => {
                document.getElementById('interactiveArea').style.display = 'block';
                userAnswerInput.value = ""; 
                userAnswerInput.focus();
                document.getElementById('displayText').innerText = "🎧 答題中...（請依語音作答或點擊麥克風）";
            });
        }

        document.getElementById('repeatBtn').onclick = () => {
            if(!isPracticing) return;
            attempts++;
            if (attempts > 3) {
                streak = 0;
                document.getElementById('streakDisplay').innerText = `連續通過: ${streak} / 10`;
            }
            document.getElementById('attemptDisplay').innerText = `本題嘗試: ${attempts}`;
            document.getElementById('interactiveArea').style.display = 'none';
            let text = currentQ.statement + "， " + currentQ.questions[subQIndex];
            speakText(text, () => {
                document.getElementById('interactiveArea').style.display = 'block';
                userAnswerInput.value = "";
                userAnswerInput.focus();
            });
        };

        document.getElementById('submitAnsBtn').onclick = () => {
            if (isListening && recognition) {
                recognition.stop();
            }
            const val = userAnswerInput.value.trim();
            const std = currentQ.answers[subQIndex];
            const isCorrect = isAnswerCorrect(val, std, currentUnit);

            userSessionRecords.push({ q: currentQ.questions[subQIndex], ans: val, correct: isCorrect, std: std === "" ? "(留空/無法安立)" : std });
            
            if (++subQIndex < currentQ.questions.length) {
                askQuestion(false);
            } else {
                showReviewPanel();
            }
        };

        // 智慧答案比對函數：支援數字與口語化表達（如「兩個」、「兩種」、「我猜是2」等）
        function isAnswerCorrect(userAns, stdAns, unit) {
            const rawVal = userAns.trim();
            const rawStd = stdAns.trim();

            // 完全精確比對，或兩者皆留空
            if (rawVal === rawStd || (rawStd === "" && rawVal === "")) {
                return true;
            }

            // 針對阿拉伯數字型標準答案（如單元 A 的 "1", "2", "3"）進行國字與口語化比對
            if (/^\d+$/.test(rawStd)) {
                let normalized = rawVal
                    .replace(/一/g, '1')
                    .replace(/二|兩|雙/g, '2')
                    .replace(/三/g, '3')
                    .replace(/四/g, '4')
                    .replace(/五/g, '5');
                
                const foundDigits = normalized.match(/\d+/g);
                if (foundDigits && foundDigits.includes(rawStd)) {
                    return true;
                }
            }

            return false;
        }

        userAnswerInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
                document.getElementById('submitAnsBtn').click();
            }
        };

        function showReviewPanel() {
            document.getElementById('interactiveArea').style.display = 'none';
            const allCorrect = userSessionRecords.every(r => r.correct);
            
            let html = "";
            userSessionRecords.forEach((rec, idx) => {
                html += `<div class="review-row">
                    <strong>Q${idx + 1}: ${rec.question || rec.q}</strong><br>
                    👉 您的輸入：<span style="color: #2980b9;">${rec.ans || "(未填)"}</span><br>
                    🎯 標準答案：<span style="color: #27ae60; font-weight: bold;">${rec.std}</span>
                </div>`;
            });
            document.getElementById('reviewContent').innerHTML = html;
            document.getElementById('reviewPanel').style.display = 'block';

            if (allCorrect) {
                if (attempts <= 3) {
                    streak++;
                } else {
                    streak = 0;
                }
                
                document.getElementById('streakDisplay').innerText = `連續通過: ${streak} / 10`;

                if (streak >= 10) {
                    document.getElementById('reviewTitle').innerText = "🏆 恭喜您！成功通過本單元的測試！";
                    speakText("恭喜您通過本單元的測試，請重新選擇練習單元", () => {
                        stopPractice();
                    });
                } else {
                    document.getElementById('reviewTitle').innerText = attempts <= 3 ? "🎉 本題完全答對！" : "⚠️ 答對但嘗試超過3次，連續次數重置！";
                    speakText("太棒了", () => setTimeout(startNewQuestion, 1500));
                }
            } else {
                // 答錯時增嘗試次數；若超過 3 次則連續數歸零，但永遠允許繼續練習本題
                attempts++;
                if (attempts > 3) {
                    streak = 0;
                    document.getElementById('streakDisplay').innerText = `連續通過: ${streak} / 10`;
                }
                document.getElementById('attemptDisplay').innerText = `本題嘗試: ${attempts}`;
                
                document.getElementById('reviewTitle').innerText = attempts <= 3 ? "❌ 答錯了，請再試一次本題！" : "⚠️ 嘗試已超過3次，連續次數歸零！請繼續嘗試本題。";
                speakText("答錯了，請再試一次", () => setTimeout(() => { 
                    document.getElementById('reviewPanel').style.display = 'none'; 
                    subQIndex = 0; 
                    userSessionRecords = [];
                    askQuestion(true); 
                }, 1500));
            }
        }

        stopBtn.onclick = stopPractice;

        function stopPractice() {
            isPracticing = false;
            if (isListening && recognition) recognition.stop();
            window.speechSynthesis.cancel();
            startBtn.disabled = false; stopBtn.disabled = true; unitSelect.disabled = false;
            document.getElementById('interactiveArea').style.display = 'none';
            document.getElementById('reviewPanel').style.display = 'none';
            document.getElementById('displayText').innerText = "請選擇單元開始練習";
        }
    </script>
