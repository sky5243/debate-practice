<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辯論理路全題庫單元練習系統</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: #f4f7f6; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            color: #2c3e50;
        }
        .container { 
            max-width: 750px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }
        h1 { margin-top: 0; font-size: 26px; color: #1a252f; }
        .control-panel {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 10px; margin-bottom: 20px; background: #f8fafc; padding: 15px;
            border-radius: 12px; border: 1px solid #e2e8f0;
        }
        .control-group { display: flex; align-items: center; gap: 6px; }
        select, button { 
            padding: 10px 14px; font-size: 16px; border-radius: 8px;
            border: 1px solid #cbd5e1; outline: none; transition: all 0.2s ease;
        }
        select:focus { border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2); }
        #startBtn { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        #startBtn:hover { background-color: #2980b9; }
        #stopBtn { background-color: #e74c3c; color: white; border: none; cursor: pointer; font-weight: bold; }
        #stopBtn:disabled { background-color: #cbd5e1; cursor: not-allowed; }
        .status-panel { 
            display: flex; justify-content: space-around; background: #ecf0f1; 
            padding: 15px; border-radius: 10px; margin: 20px 0; font-weight: bold; font-size: 18px;
        }
        .statement-box {
            background-color: #eef6fb;
            border-left: 5px solid #3498db;
            padding: 16px;
            border-radius: 8px;
            margin: 15px 0 10px 0;
            font-size: 20px;
            font-weight: bold;
            color: #1a252f;
            text-align: left;
            line-height: 1.5;
            display: none;
        }
        .display-text { 
            font-size: 22px; min-height: 50px; margin: 10px 0 20px 0; color: #e67e22; font-weight: bold; 
            display: flex; align-items: center; justify-content: center;
        }
        .interactive-area { display: none; margin: 20px 0; }
        .input-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 580px; margin: 15px auto; }
        #userAnswerInput { flex: 1; font-size: 18px; padding: 12px 16px; border: 2px solid #3498db; border-radius: 10px; outline: none; }
        #userAnswerInput:focus { box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.25); }
        .icon-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 48px; height: 48px; border-radius: 10px; border: none; cursor: pointer;
            transition: all 0.2s ease; padding: 0; flex-shrink: 0;
        }
        .mic-btn { background-color: #e2e8f0; color: #475569; }
        .mic-btn:hover { background-color: #cbd5e1; }
        .mic-btn.recording { background-color: #ef4444; color: white; animation: pulse 1.2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .send-btn { background-color: #27ae60; color: white; }
        .send-btn:hover { background-color: #219150; }
        .repeat-btn {
            background-color: #f39c12; color: white; border: none; padding: 10px 20px;
            font-weight: bold; cursor: pointer; border-radius: 8px; margin-bottom: 10px;
        }
        .repeat-btn:hover { background-color: #d68910; }
        .speech-hint { font-size: 14px; color: #64748b; min-height: 20px; margin-top: 4px; }
        .review-panel { 
            background: #fff8e1; border: 2px solid #ffb300; border-radius: 12px; 
            padding: 20px; margin: 20px 0; display: none; text-align: left; 
        }
        .review-row { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #ffe082; font-size: 15px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>辯論理路全題庫單元練習系統</h1>
        
        <div class="control-panel">
            <div class="control-group">
                <label for="unitSelect">單元：</label>
                <select id="unitSelect">
                    <option value="A">【單元 A】模組、格式用語</option>
                    <option value="B">【單元 B】模組內容</option>
                    <option value="C">【單元 C】論式的三段論述</option>
                    <option value="D1">【單元 D1】三段論述推導</option>
                    <option value="D2">【單元 D2】錯誤推論分析</option>
                </select>
            </div>

            <div class="control-group">
                <label for="rateSelect">語速：</label>
                <select id="rateSelect">
                    <option value="0.75">0.75 倍速</option>
                    <option value="1">1.0 倍速</option>
                    <option value="1.25" selected>1.25 倍速</option>
                    <option value="1.5">1.5 倍速</option>
                    <option value="1.75">1.75 倍速</option>
                    <option value="2">2.0 倍速</option>
                </select>
            </div>

            <button id="startBtn">開始練習</button>
            <button id="stopBtn" disabled>中斷練習 / 更換單元</button>
        </div>
        
        <div class="status-panel">
            <span id="streakDisplay">連續通過: 0 / 10</span>
            <span id="attemptDisplay">本題嘗試: 1</span>
        </div>
        
        <!-- 顯示論式主題內容 -->
        <div class="statement-box" id="statementBox"></div>

        <!-- 顯示當前引導問題 -->
        <div class="display-text" id="displayText">請選擇單元開始</div>
        
        <div class="interactive-area" id="interactiveArea">
            <button class="repeat-btn" id="repeatBtn">🔊 論式再說一遍</button>
            
            <div class="input-wrapper">
                <input type="text" id="userAnswerInput" placeholder="輸入或使用語音答題..." autocomplete="off">
                <button type="button" class="icon-btn mic-btn" id="micBtn" title="點擊進行語音辨識">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>
                <button type="button" class="icon-btn send-btn" id="submitAnsBtn" title="送出答案">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <div class="speech-hint" id="speechHint"></div>
        </div>
        
        <div class="review-panel" id="reviewPanel">
            <div style="font-weight: bold; color: #f57f17; font-size: 18px; margin-bottom: 12px; text-align: center;" id="reviewTitle">📋 本題作答結算：</div>
            <div id="reviewContent"></div>
        </div>
    </div>

    <!-- 載入 ES6 主程式進入點 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
